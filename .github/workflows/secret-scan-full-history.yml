# Full-history secret scan — the gap `ci.yml`'s per-push `secret-scan` job
# can't cover. That job (and gitleaks-action generally) only ever scans the
# commit range of the current push/PR, never the repo's existing history —
# confirmed 2026-09-23 after a real hardcoded Google Maps key, sitting in
# this repo's very first commit since 2026-08-04, went undetected through
# 200+ runs of that job for exactly this reason. A one-off manual
# `gitleaks detect --source=.` (no log-opts range restriction) is what
# actually caught it.
#
# This job runs that same full-history scan on a schedule instead of a
# person remembering to do it by hand. Report-only, same reasoning as
# ci.yml's own header: a finding in existing history can't be fixed by
# editing the current tree, only by rewriting it — a call for a human to
# make deliberately, never something this job should force by going red.
#
# Doesn't use gitleaks/gitleaks-action here since that action's commit-range
# auto-detection is exactly the behavior being worked around — installing
# the gitleaks CLI directly and calling it with no --log-opts (its default
# is full history) instead. Version pinned to match what ci.yml's
# gitleaks-action currently resolves to; sha256-verified since this is a
# raw binary download rather than an SHA-pinned Action.

name: Secret Scan (Full History)

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

jobs:
  full-history-scan:
    name: Gitleaks Full History
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.24.3
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      # No --log-opts: gitleaks defaults to scanning every commit reachable
      # from HEAD, which is the entire point of this job over ci.yml's.
      - name: Full-history scan
        continue-on-error: true
        run: ./gitleaks detect --source=. --redact -v --log-level=debug
