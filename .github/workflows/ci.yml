# CI pipeline — SSP sc-5/sd-3/sd-4/sd-5/sd-6/cs-5/cs-7.
#
# This repo had no CI at all before this (a deliberate choice at the time —
# see README's "Migrating from Replit" table: "no CI wired... the deploy
# step is a manual 'pull this image' action regardless, so CI would only
# automate half the pipeline"). That's still true for *deployment* — this
# workflow does not build/push/deploy anything — but it closes the SSP gaps
# a pre-merge check gate is actually meant to cover: tests/typecheck passing
# before merge, static analysis, dependency/secret scanning, and container
# hygiene.
#
# Blocking vs report-only, deliberately not uniform: jobs this repo's own
# tooling could verify clean *before* this workflow was written (typecheck,
# build, a critical-only dependency-audit threshold — see the "Dependency
# hygiene pass ahead of CI" commit, which got real findings from 41 down to
# 2 first) are blocking from day one. Jobs relying on external scanners this
# environment couldn't dry-run locally (hadolint, trivy, gitleaks, semgrep)
# run in report-only mode for their first real pass — `continue-on-error:
# true`, clearly marked below — so this workflow doesn't repeat the mistake
# a same-day typecheck gate would have made (immediately and permanently
# red from pre-existing findings nobody had triaged yet). Once a human
# reviews that first run's actual findings, flip continue-on-error to false
# on each job as it's confirmed clean or triaged.
#
# STATUS (2026-09-23): that review step didn't actually happen for months —
# gitleaks and Semgrep both sat green-but-unreviewed since this file was
# written (a real hardcoded secret and 17 Semgrep findings both went
# undetected as a result; see those jobs' own comments for what was found
# and fixed). All three are triaged and blocking now — hadolint's one
# pass found only 2 info-level Dockerfile style notes, both deliberate
# choices, suppressed with justified `# hadolint ignore=` comments.
# Trivy's first pass found 90+65 CRITICAL/HIGH CVEs, almost
# entirely in the node:20-slim base image's OS packages rather than this
# repo's own dependencies (pnpm audit covers those separately and is
# clean) — genuinely needs its own triage pass (likely "rebase to a
# freshly-patched base image", not a per-CVE fix), not a quick flip.
#
# Every third-party action below is pinned to a full commit SHA, not a
# floating tag (sc-4/sc-6-style dependency pinning applied to the pipeline
# itself, not just npm packages) — dependabot.yml keeps them current
# without giving up that pinning (Dependabot understands and updates
# SHA-pinned actions, bumping both the SHA and the trailing version comment).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── sc-5 / sd-3: build & typecheck gate ────────────────────────────────────
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server run typecheck
      - run: pnpm --filter @workspace/roster-dashboard run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - name: Build roster-dashboard
        run: pnpm --filter @workspace/roster-dashboard run build
        env:
          PORT: "5180"
          BASE_PATH: /roster/

  # ── sd-5: dependency vulnerability scanning ─────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Blocking floor: nothing critical, verified clean as of the
      # "Dependency hygiene pass ahead of CI" commit.
      - run: pnpm audit --audit-level=critical
      # Informational: the full report, including the 2 known/accepted
      # high-severity xlsx findings (see that same commit for why they
      # can't be resolved via a version bump) — never fails the job, just
      # keeps the current state visible in the log without needing anyone
      # to remember to run `pnpm audit` by hand.
      - run: pnpm audit || true

  # ── sd-6: secret detection (new commits) ────────────────────────────────────
  # GitHub's native secret scanning/push protection requires GitHub Advanced
  # Security — not available while this repo was private, but the repo is
  # public now (2026-09-23) and both are enabled natively at the GitHub level
  # too. gitleaks stays as a second, independent layer.
  #
  # CORRECTION (2026-09-23): despite `fetch-depth: 0` below, gitleaks-action
  # does NOT scan full history here — it auto-scopes to just the current
  # push/PR's commit range (confirmed from an actual run's command line:
  # `--log-opts=--no-merges --first-parent <before>^..<after>`). fetch-depth:
  # 0 only makes that range resolvable when a push has many commits; it
  # doesn't broaden the scan. This comment previously claimed otherwise —
  # that was wrong, and is exactly how a real hardcoded Google Maps key
  # (introduced in this repo's very first commit, 2026-08-04) went
  # undetected through 200+ CI runs: every run only ever checked what was
  # new since the last one, never the existing history. A one-off full-
  # history run (manual `gitleaks detect --source=.`, no log-opts) finally
  # caught it. See `secret-scan-full-history.yml` for the job that now
  # actually covers that gap, on a schedule instead of every push.
  #
  # Now that history has had that one real pass, this job (which only ever
  # covered new commits anyway) is promoted to blocking — no more
  # continue-on-error. A finding here is always in a commit from *this*
  # push/PR, so it can always be fixed by editing the current tree before
  # merging, unlike a historical finding.
  secret-scan:
    name: Secret Detection (new commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── sd-4: static analysis ───────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        # 2026-09-23: the first real pass found 17 findings, sitting
        # unreviewed since this job was written (same root cause as the
        # secret-scan gap next to it). Triaged — 5 real fixes, 12 false
        # positives suppressed or scoped out below. Confirmed 0 findings
        # on a real run before removing continue-on-error here.
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config auto --error \
            --exclude 'node_modules' --exclude 'dist' --exclude '*.tsbuildinfo' \
            --exclude-rule javascript.lang.security.audit.unknown-value-with-script-tag.unknown-value-with-script-tag \
            .
          # unknown-value-with-script-tag excluded scan-wide (not per-file —
          # semgrep has no line-range suppression from external config, and
          # an inline `// nosemgrep` on the actual matched line is
          # impossible here: both real remaining matches (crew.ts's OFFICER,
          # manager.ts's CURRENT_USER) sit inside multi-line backtick HTML
          # templates, where any comment syntax becomes literal page output
          # rather than being read as a comment. The rule's actual concern
          # (unescaped `<`/`</script>` breaking out of the tag) is genuinely
          # fixed via lib/inlineJson.ts's jsonForScriptTag() at both sites —
          # Semgrep just can't verify a helper function's return value is
          # safe, so it keeps flagging the call regardless. Accepted
          # tradeoff: lose this one rule's coverage repo-wide rather than
          # leave this job permanently red (which trains everyone to ignore
          # it — the exact failure mode that let 17 real findings sit
          # unreviewed here in the first place).

  # ── cs-5: Dockerfile linting ─────────────────────────────────────────────────
  dockerfile-lint:
    name: Dockerfile Lint (hadolint)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-server, roster-dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        # 2026-09-23: DL3059/DL3066 (the only 2 findings) suppressed with
        # justified `# hadolint ignore=` comments in both Dockerfiles —
        # confirmed 0 findings on a real run before removing
        # continue-on-error here.
        with:
          dockerfile: artifacts/${{ matrix.service }}/Dockerfile

  # ── cs-7: container image scanning ──────────────────────────────────────────
  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [api-server, roster-dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -f artifacts/${{ matrix.service }}/Dockerfile -t cwd-${{ matrix.service }}:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # first real pass — see header
        with:
          image-ref: cwd-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
