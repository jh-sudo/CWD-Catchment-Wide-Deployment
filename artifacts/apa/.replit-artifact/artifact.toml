kind = "web"
previewPath = "/apa/"
title = "APA1 FRA & Coverage Map"
version = "1.0.0"
id = "artifacts/apa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/apa/" ]
localPort = 19712

[services.development]
run = "pnpm --filter @workspace/apa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apa", "run", "build" ]
publicDir = "artifacts/apa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19712"
BASE_PATH = "/apa/"
