kind = "mobile"
  previewPath = "/crew"
  title = "Flood Commander Dashboard"
  version = "1.0.0"
  id = "artifacts/deployment-tracker"
  router = "expo-domain"

  [[integratedSkills]]
  name = "expo"
  version = "1.0.0"

  [[services]]
  ensurePreviewReachable = "/status"
  name = "expo"
  paths = [ "/crew" ]
  localPort = 26022

  [services.development]
  run = "pnpm --filter @workspace/deployment-tracker run dev"

  [services.production]

  [services.production.build]
  args = ["pnpm", "--filter", "@workspace/deployment-tracker", "run", "build"]

  [services.production.run]
  args = ["node", "artifacts/deployment-tracker/server/serve.js"]

  [services.production.run.env]
  PORT = "26022"
  BASE_PATH = "/crew"
  NODE_ENV = "production"

  [services.production.health.startup]
  path = "/crew"

  [services.env]
  PORT = "26022"
  BASE_PATH = "/crew"
